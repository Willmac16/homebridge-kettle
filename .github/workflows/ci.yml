name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: homebridge-kettle/package.json
      - name: Install
        working-directory: homebridge-kettle
        run: npm install
      - name: Test
        working-directory: homebridge-kettle
        run: npm test
